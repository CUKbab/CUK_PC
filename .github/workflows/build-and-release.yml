name: Build and Release CUK PC

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target.os }} - ${{ matrix.target.rid }})
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: Linux
            rid: linux-x64
            runner: ubuntu-latest
            artifact: CUKbab-linux-x64.tar.gz
          - os: Windows
            rid: win-x64
            runner: windows-latest
            artifact: CUKbab-windows-x64.zip
          - os: macOS-Intel
            rid: osx-x64
            runner: macos-latest
            artifact: CUKbab-macos-x64.dmg
          - os: macOS-AppleSilicon
            rid: osx-arm64
            runner: macos-latest
            artifact: CUKbab-macos-arm64.dmg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Linux Build & Package (.tar.gz)
      - name: Build Linux
        if: matrix.target.os == 'Linux'
        run: |
          dotnet publish CUK.csproj -c Release -r linux-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish/linux
          cp CUK.desktop ./publish/linux/ 2>/dev/null || true
          cp Assets/cuk_logo.png ./publish/linux/ 2>/dev/null || true
          cd ./publish/linux
          tar -czvf ../../${{ matrix.target.artifact }} *

      # Windows Build & Package (.zip)
      - name: Build Windows
        if: matrix.target.os == 'Windows'
        shell: pwsh
        run: |
          dotnet publish CUK.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish/win
          Compress-Archive -Path ./publish/win/* -DestinationPath ${{ matrix.target.artifact }}

      # macOS Build & Package (.app & .dmg)
      - name: Build macOS
        if: startsWith(matrix.target.os, 'macOS')
        run: |
          dotnet publish CUK.csproj -c Release -r ${{ matrix.target.rid }} --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish/bin
          
          mkdir -p ./publish/CUK밥.app/Contents/MacOS
          mkdir -p ./publish/CUK밥.app/Contents/Resources
          mv ./publish/bin/CUK밥 ./publish/CUK밥.app/Contents/MacOS/CUK밥
          chmod +x ./publish/CUK밥.app/Contents/MacOS/CUK밥
          
          cat <<EOF > ./publish/CUK밥.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>CUK밥</string>
              <key>CFBundleDisplayName</key>
              <string>CUK밥</string>
              <key>CFBundleIdentifier</key>
              <string>com.cukbab.cukpc</string>
              <key>CFBundleVersion</key>
              <string>1.0.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleExecutable</key>
              <string>CUK밥</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF
          
          hdiutil create -volname "CUK밥" -srcfolder ./publish/CUK밥.app -ov -format UDZO "${{ matrix.target.artifact }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.artifact }}
          path: ${{ matrix.target.artifact }}
  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi
      - name: Download and Format Changelog
        run: |
          curl -sL "https://raw.githubusercontent.com/CUKbab/CUK/refs/heads/main/pc_changelogs/en.md" -o changelog.md
          
          sed -i '/^# CUK밥 PC/d' changelog.md

      - name: Create GitHub Release & Upload Files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Release ${{ steps.vars.outputs.tag }}
          body_path: changelog.md
          generate_release_notes: false
          files: ./artifacts/*
